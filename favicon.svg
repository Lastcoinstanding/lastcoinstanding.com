<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130">
  <title>Last Coin Standing</title>
  <!-- The brand mark, squared for the tab slot: identical ellipse geometry to
       brand/lcs-mark-5.svg, translated down 31 units so the 130x68 content is
       centred in a 130x130 square. No colours or proportions changed - this is
       the same mark the favicon PNGs and the header mark render, so the icon a
       browser picks (SVG on modern desktop, PNG elsewhere) is the same image.
       Replaces an 87KB SVG that only wrapped a base64 PNG of the OLD icon. -->
  <g transform="translate(0,31)">
    <ellipse cx="16" cy="63" rx="13" ry="5" fill="#5a5247"/>
    <ellipse cx="41" cy="55" rx="11.5" ry="10" fill="#7d7364"/>
    <ellipse cx="66" cy="46" rx="10" ry="15" fill="#b8945f"/>
    <ellipse cx="91" cy="36" rx="8.5" ry="20" fill="#e09422"/>
    <ellipse cx="116" cy="25" rx="7" ry="25" fill="#F7931A"/>
  </g>
</svg>
